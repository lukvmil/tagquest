<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tagquest</title>
  </head>
  <body>
    <p>yo yo!</p>
    <button onclick="printSomething();">print something :o</button>
  </body>
  <script>
    function printSomething() {
        fetch("receipt.recurse.com/text", {
            method: "POST", 
            credentials: "include",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                text: "hello world!!!!"
            })
        })
    }
  </script>
</html>
