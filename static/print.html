<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tagquest</title>
  </head>
  <body>
  </body>
  <script>
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    const receiptUrl = "/receipt";
    const printerEscposUrl = "https://receipt.recurse.com/escpos";
    // falls back to home if the receipt never loads
    let redirectUrl = "/";

    async function printTag() {
      const escposResp = await fetch(receiptUrl);
      if (!escposResp.ok) {
        throw new Error(`fetching receipt failed: HTTP ${escposResp.status} ${await escposResp.text()}`);
      }
      redirectUrl = `/t/${escposResp.headers.get("X-Tag-Id")}`;
      const escposBytes = await escposResp.arrayBuffer();

      const printResp = await fetch(printerEscposUrl, {
        method: "POST",
        credentials: "include",
        headers: {
          "Content-Type": "application/octet-stream",
          "X-CSRF-Token": getCookie("receipt_csrf"),
        },
        body: escposBytes,
      });
      if (!printResp.ok) {
        throw new Error(`printing failed: HTTP ${printResp.status} ${await printResp.text()}`);
      }
    }

    printTag()
      .catch((err) => console.error(err))
      .finally(() => window.location.replace(redirectUrl));
  </script>
</html>
