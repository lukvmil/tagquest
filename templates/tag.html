<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tagquest</title>
  </head>
  <body>
    <a href="/"><- back home</a>
    <p>Tag Quest:<p>
    <p>{{ tag.quest }}</p>
    <hr/>
    <p>Entries:</p>
    <ul>
      {% for entry in entries %}
      <li>[{{ entry.created_at.strftime('%Y-%m-%d %H:%M') }}]: {{ entry.text }}</li>
      {% endfor %}
    </ul>

    {% if valid_key == True %}
    <form action="{{ url_for('post_entry', tag_id=tag.id) }}" method="post">
      <label for="text">Add an entry to this quest:</label><br>
      <textarea id="text" name="text" rows="6" cols="40"></textarea><br>
      <button type="submit">Submit</button>
    </form>
    {% endif %}
  </body>
</html>
