<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tagquest</title>
  </head>
  <body>
    <p>Tag Quest:<p>
    <p>{{ tag.quest }}</p>

    <p>Entries:</p>
    {% for entry in entries %}
    <p>{{ entry.text }}</p>
    {% endfor %}

    {% if valid_key == True %}
    <form action="{{ url_for('post_entry', tag_id=tag.id) }}" method="post">
      <label for="text">Add an entry to this quest:</label><br>
      <textarea id="text" name="text" rows="6" cols="40"></textarea><br>
      <button type="submit">Submit</button>
    </form>
    {% endif %}
  </body>
</html>
